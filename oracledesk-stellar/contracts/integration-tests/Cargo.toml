[package]
name = "integration-tests"
version = "0.1.0"
edition = "2021"
publish = false
description = "Cross-contract and bounded-exhaustive tests; ships no contract."

[lib]
doctest = false

[dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils", "experimental_spec_shaking_v2"] }
resolver_contract = { package = "resolver", path = "../resolver" }

[dev-dependencies]
treasury = { path = "../treasury" }
market-core = { path = "../market-core" }
proptest = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stellar-xdr = { version = "27", features = ["std"] }
wasmparser = "0.116"
