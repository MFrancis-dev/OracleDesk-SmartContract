[workspace]

[package]
name = "budget-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Deterministic Soroban resource-budget regression tests. Standalone (not a
# workspace member) because the wasm files must exist at compile time:
# `make budget` depends on `make build`. `cargo test --workspace` stays
# buildable on a clean checkout without wasm.
[dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils", "experimental_spec_shaking_v2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Used only to compute the exact legacy ResolutionSpec hash (production
# resolver types) and to write treasury policy storage directly. Execution
# always goes through the imported wasm clients below.
resolver = { path = "../resolver" }
treasury = { path = "../treasury" }
market-core = { path = "../market-core" }

[profile.test]
opt-level = 1
