# docker-compose.yml for multi-instance x402 deployment with Redis coordination
version: '3.8'

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  x402-1:
    build:
      context: .
      dockerfile: Dockerfile.x402
    environment:
      X402_STORE: redis
      REDIS_URL: redis://redis:6379/0
      X402_LOCK_TTL_MS: "30000"
      X402_LOCK_WAIT_MS: "1000"
      X402_RESULT_TTL_MS: "600000"
      LOG_LEVEL: info
      PORT: "3000"
      METRICS_PORT: "9090"
    ports:
      - "3000:3000"
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  x402-2:
    build:
      context: .
      dockerfile: Dockerfile.x402
    environment:
      X402_STORE: redis
      REDIS_URL: redis://redis:6379/0
      X402_LOCK_TTL_MS: "30000"
      X402_LOCK_WAIT_MS: "1000"
      X402_RESULT_TTL_MS: "600000"
      LOG_LEVEL: info
      PORT: "3001"
      METRICS_PORT: "9091"
    ports:
      - "3001:3000"
      - "9091:9090"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

volumes:
  redis-data:
